name: Deploy DEV · API (Worker staging + migration no D1 DEV)

# ─────────────────────────────────────────────────────────────────────────
# POR QUE ESTE WORKFLOW EXISTE, E POR QUE ELE SÓ RODA NO BOTÃO
#
# `deploy-dev.yml` publica o Pages do DEV automaticamente a cada push em
# `develop`. As outras duas metades do ambiente — o Worker
# `marquesa-api-staging` e o schema do `marquesa-db-dev` — nunca tiveram
# caminho de CI: eram comando de terminal, na máquina de quem tem credencial.
# Resultado prático: o painel sobe sozinho e a API dele fica para trás.
#
# `docs/SECURITY.md` classifica `wrangler deploy` como Classe C — nenhum
# agente executa, em ambiente nenhum. Este arquivo NÃO afrouxa essa regra:
#
#   • o gatilho é `workflow_dispatch` e SÓ ele. Não roda em push, não roda em
#     merge, não roda em schedule. Um agente pode escrever este arquivo; ele
#     não pode fazê-lo rodar. Quem aperta o botão é uma pessoa;
#   • a pessoa precisa DIGITAR `staging` no campo de confirmação. Clique
#     acidental na lista de workflows não publica nada;
#   • todo comando carrega `--env staging`, escrito literalmente aqui, e o
#     job aborta antes de qualquer escrita se o `wrangler.toml` resolver esse
#     ambiente para outro banco que não `marquesa-db-dev`.
#
# O que ele NUNCA alcança, por construção: `marquesa-api` (produção),
# `marquesa-db` (o banco CONGELADO de rollback), `marquesa-db-prod`
# (produção) e `marquesa-fotos`. Nenhum desses nomes aparece em comando
# nenhum abaixo, e a verificação de alvo recusa qualquer um deles.

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "staging" para confirmar. Qualquer outra coisa aborta.'
        required: true
        default: ''
      aplicar_migration:
        description: 'Aplicar migrations pendentes no marquesa-db-dev?'
        type: boolean
        default: true
      publicar_worker:
        description: 'Publicar o Worker marquesa-api-staging?'
        type: boolean
        default: true

concurrency:
  group: deploy-staging-api
  cancel-in-progress: false

jobs:
  publicar:
    name: Migration + Worker do DEV
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # O ambiente inteiro, num lugar só. Trocar isto é trocar o alvo, e a
      # verificação abaixo tem de concordar.
      ENV_ALVO: staging
      DB_ESPERADO: marquesa-db-dev
      WORKER_ESPERADO: marquesa-api-staging

    steps:
      - name: Confirmação explícita da pessoa
        run: |
          set -e
          if [ "${{ inputs.confirmacao }}" != "staging" ]; then
            echo "::error::Confirmação ausente ou errada. Digite exatamente 'staging'."
            exit 1
          fi
          echo "Confirmado por ${{ github.actor }} para o ambiente: $ENV_ALVO"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar wrangler
        working-directory: api
        run: npm ci || npm install

      # ── PRÉ-CHECAGEM ────────────────────────────────────────────────────
      # Prova, lendo o wrangler.toml, que `--env staging` resolve para o
      # banco e o Worker do DEV. Se alguém trocar o database_id do bloco
      # staging pelo de produção, o job morre AQUI, antes de escrever.
      - name: Provar que o alvo é DEV, não produção
        working-directory: api
        run: |
          set -e
          echo "── bloco [env.staging] do wrangler.toml ──"
          sed -n '/^\[env\.staging\]/,/^\[env\.staging\.vars\]/p' wrangler.toml

          NOME_WORKER=$(sed -n '/^\[env\.staging\]/,/^\[\[/p' wrangler.toml \
            | grep -E '^name *=' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          NOME_DB=$(sed -n '/env\.staging\.d1_databases/,/^$/p' wrangler.toml \
            | grep -E '^database_name *=' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          ID_DB=$(sed -n '/env\.staging\.d1_databases/,/^$/p' wrangler.toml \
            | grep -E '^database_id *=' | head -1 | sed 's/.*= *"\(.*\)"/\1/')

          echo "Worker resolvido : $NOME_WORKER"
          echo "D1 resolvido     : $NOME_DB ($ID_DB)"

          [ "$NOME_WORKER" = "$WORKER_ESPERADO" ] || {
            echo "::error::Worker do bloco staging é '$NOME_WORKER', esperado '$WORKER_ESPERADO'."; exit 1; }
          [ "$NOME_DB" = "$DB_ESPERADO" ] || {
            echo "::error::D1 do bloco staging é '$NOME_DB', esperado '$DB_ESPERADO'."; exit 1; }

          # cinto e suspensório: nenhum nome de produção pode estar aqui
          case "$NOME_DB" in
            marquesa-db|marquesa-db-prod)
              echo "::error::ALVO É PRODUÇÃO. Abortado."; exit 1;;
          esac
          case "$NOME_WORKER" in
            marquesa-api)
              echo "::error::ALVO É O WORKER DE PRODUÇÃO. Abortado."; exit 1;;
          esac
          echo "✓ alvo provado: DEV"

      # ── ESTADO ANTES ────────────────────────────────────────────────────
      # As contagens que a rodada precisa preservar. Ficam no log do run,
      # para comparar com o depois sem depender de ninguém ter anotado.
      - name: Contagens ANTES (somente leitura)
        working-directory: api
        run: |
          set -e
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --json --command "
            SELECT (SELECT COUNT(*) FROM produtos)                      AS produtos,
                   (SELECT COALESCE(SUM(qtd),0) FROM produtos)          AS soma_qtd,
                   (SELECT COUNT(*) FROM movimentos)                    AS movimentos,
                   (SELECT COUNT(*) FROM vendas)                        AS vendas,
                   (SELECT COUNT(*) FROM vendas WHERE cancelada=0)      AS vendas_vivas,
                   (SELECT COUNT(*) FROM revendedoras)                  AS revendedoras,
                   (SELECT COUNT(*) FROM maletas)                       AS maletas,
                   (SELECT COUNT(*) FROM clientes)                      AS clientes
          " | tee ../antes.json

      - name: Razão contábil ANTES (tem de vir vazia)
        working-directory: api
        run: |
          set -e
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --json --command "
            SELECT COUNT(*) AS divergentes FROM produtos p
              LEFT JOIN (SELECT sku, SUM(qtd) soma FROM movimentos GROUP BY sku) m
                ON m.sku = p.sku
             WHERE p.qtd <> COALESCE(m.soma,0)
          "

      # ── MIGRATION ───────────────────────────────────────────────────────
      # Aditiva: só CREATE TABLE/INDEX IF NOT EXISTS e ALTER TABLE ADD COLUMN.
      # Nenhum DROP, nenhum DELETE, nenhum UPDATE de dado — o único UPDATE
      # preenche `clientes.nome_norm` onde ele está NULL.
      #
      # `ALTER TABLE ADD COLUMN` não é idempotente no SQLite: rodar duas
      # vezes devolve "duplicate column name". Por isso o passo checa antes
      # se a migration já entrou, em vez de tentar e engolir erro — engolir
      # erro esconderia uma falha de verdade no meio.
      - name: Migration · vendas-histórico (aditiva)
        if: ${{ inputs.aplicar_migration }}
        working-directory: api
        run: |
          set -e
          JA=$(npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --json --command \
            "SELECT COUNT(*) AS n FROM sqlite_master
              WHERE type='table' AND name='vendas_historico_itens'" \
            | grep -o '"n": *[0-9]*' | grep -o '[0-9]*' | head -1)

          if [ "$JA" = "1" ]; then
            echo "migracao-vendas-historico.sql já aplicada — nada a fazer."
          else
            echo "aplicando migracao-vendas-historico.sql…"
            npx wrangler d1 execute DB --env "$ENV_ALVO" --remote \
              --file=migracao-vendas-historico.sql
          fi

      - name: Conferir o schema novo
        if: ${{ inputs.aplicar_migration }}
        working-directory: api
        run: |
          set -e
          echo "── tabelas novas ──"
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --command "
            SELECT name FROM sqlite_master WHERE type='table'
             AND name IN ('vendas_historico_lotes','vendas_historico_itens','clientes_vinculo_revisao')
             ORDER BY name"
          echo "── índices novos ──"
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --command "
            SELECT name FROM sqlite_master WHERE type='index'
             AND (name LIKE 'idx_vh_%' OR name LIKE 'idx_cvr_%' OR name LIKE 'idx_clientes_%')
             ORDER BY name"
          echo "── colunas novas de clientes ──"
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --command \
            "SELECT name FROM pragma_table_info('clientes') ORDER BY name"

      # ── WORKER ──────────────────────────────────────────────────────────
      - name: Publicar o Worker do DEV
        if: ${{ inputs.publicar_worker }}
        working-directory: api
        run: npx wrangler deploy --env "$ENV_ALVO"

      # ── ESTADO DEPOIS ───────────────────────────────────────────────────
      - name: Contagens DEPOIS + razão contábil
        working-directory: api
        run: |
          set -e
          echo "── contagens DEPOIS ──"
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --json --command "
            SELECT (SELECT COUNT(*) FROM produtos)                 AS produtos,
                   (SELECT COALESCE(SUM(qtd),0) FROM produtos)     AS soma_qtd,
                   (SELECT COUNT(*) FROM movimentos)               AS movimentos,
                   (SELECT COUNT(*) FROM vendas)                   AS vendas,
                   (SELECT COUNT(*) FROM vendas WHERE cancelada=0) AS vendas_vivas,
                   (SELECT COUNT(*) FROM revendedoras)             AS revendedoras,
                   (SELECT COUNT(*) FROM maletas)                  AS maletas,
                   (SELECT COUNT(*) FROM clientes)                 AS clientes
          " | tee ../depois.json

          echo ""
          echo "── ANTES ──"; cat ../antes.json
          echo "── DEPOIS ──"; cat ../depois.json
          echo ""
          echo 'A migration é aditiva: produtos, soma_qtd, movimentos, vendas,'
          echo 'revendedoras e maletas têm de estar IDÊNTICOS. A tabela clientes'
          echo 'só muda se a importação histórica rodar depois — ela NÃO roda aqui.'

      - name: Razão contábil DEPOIS (tem de continuar vazia)
        working-directory: api
        run: |
          set -e
          npx wrangler d1 execute DB --env "$ENV_ALVO" --remote --json --command "
            SELECT COUNT(*) AS divergentes FROM produtos p
              LEFT JOIN (SELECT sku, SUM(qtd) soma FROM movimentos GROUP BY sku) m
                ON m.sku = p.sku
             WHERE p.qtd <> COALESCE(m.soma,0)
          "

      # ── SMOKE TEST DO PUBLICADO ─────────────────────────────────────────
      - name: Smoke test do Worker publicado
        if: ${{ inputs.publicar_worker }}
        run: |
          set -e
          W=https://marquesa-api-staging.marquesaasemijoias.workers.dev

          echo "── saúde ──"
          curl -fsS -m 15 "$W/api/health"; echo

          echo "── as rotas novas existem? (401 = existe e está protegida) ──"
          for r in /api/analytics/vendas /api/analytics/clientes /api/analytics/origem \
                   /api/analytics/produtos /api/analytics/categorias /api/analytics/evolucao \
                   /api/vendas/lista /api/vendas/historico/lotes; do
            C=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$W$r")
            echo "  $C  $r"
            [ "$C" = "401" ] || { echo "::error::$r respondeu $C, esperado 401"; exit 1; }
          done

          echo "── CORS para o painel do DEV ──"
          curl -s -D- -o /dev/null -m 15 \
            -H "Origin: https://marquesa-dev.pages.dev" \
            "$W/api/health" | grep -i 'access-control-allow-origin' || {
              echo "::error::sem Access-Control-Allow-Origin para marquesa-dev.pages.dev"; exit 1; }

      - name: Resumo
        run: |
          echo "### DEV · API publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: \`marquesa-api-staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- D1: \`marquesa-db-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- Migration aplicada: \`${{ inputs.aplicar_migration }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Worker publicado: \`${{ inputs.publicar_worker }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Produção não foi tocada: nenhum comando cita \`marquesa-api\`," >> $GITHUB_STEP_SUMMARY
          echo "\`marquesa-db\` ou \`marquesa-db-prod\`." >> $GITHUB_STEP_SUMMARY
