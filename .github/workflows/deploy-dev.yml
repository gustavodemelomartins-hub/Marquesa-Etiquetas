name: Deploy DEV (Cloudflare Pages)

# marquesa-dev é um projeto Pages Direct Upload — não tem Git Integration
# nativa da Cloudflare, e não pode ganhar uma depois de criado. Este
# workflow É o mecanismo de deploy, e publica o AMBIENTE DEV INTEIRO num
# endereço só: marquesa-dev.pages.dev.
#
# O que vai no ar:
#   /                  → redireciona para o painel (ver _redirects)
#   /dashboard.html    → o painel: Etiqueta · Estoque · Revendedoras · Vendas
#   /index.html        → o app de etiquetas autônomo, mantido como
#                        referência; não é mais destino de navegação
#   /painel-novo/      → o frontend React, em construção, no mesmo domínio
#
# Um DEV só. Nada aqui toca main, marquesa-api ou marquesa-db — o Worker
# staging (marquesa-api-staging) é publicado por outro caminho, à parte
# deste arquivo.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'src/dashboard.tpl.html'
      - 'src/build.py'
      - 'index.html'
      - 'dashboard.html'
      - 'sw.js'
      - 'manifest.json'
      - '_redirects'
      - 'brand/**'
      - 'icons/**'
      - 'vendor/**'
      - '.github/workflows/deploy-dev.yml'
  # Permite reexecutar sem precisar de um commit que toque os caminhos acima.
  workflow_dispatch: {}

# Evita dois deploys concorrentes pisando um no outro se dois pushes
# chegarem em sequência rápida.
concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar, montar e publicar em marquesa-dev.pages.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # histórico inteiro: o teste de migration compara o schema atual
          # com o de antes dela, e busca esse "antes" no próprio Git
          fetch-depth: 0

      - name: Node 22 com cache do npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do painel novo
        working-directory: frontend
        run: npm ci

      - name: Testes do painel novo
        working-directory: frontend
        run: npm test

      - name: Build do painel novo (inclui tsc --noEmit)
        working-directory: frontend
        run: npm run build

      # O único teste de backend que cabe no CI: não precisa de Worker, de D1
      # nem de rede — roda contra dois SQLite temporários com o `node:sqlite`
      # do runtime. Ele prova que `api/schema.sql` e as migrations continuam
      # dizendo a mesma coisa; divergirem em silêncio só quebraria no dia de
      # criar o banco do zero, que é o pior dia para descobrir.
      #
      # `fetch-depth: 0` é necessário: o teste pega o schema ANTERIOR do
      # histórico do Git, e um clone raso não o teria.
      - name: Schema e migration continuam dizendo a mesma coisa
        run: node src/migracao-variantes-test.mjs

      # dashboard.html é MONTADO a partir de src/dashboard.tpl.html. Rodar o
      # build aqui é o que garante que o painel publicado seja o do template
      # — nunca uma versão parada que alguém esqueceu de regerar.
      - name: Montar o painel a partir do template
        run: python3 src/build.py

      - name: Juntar o site do DEV num diretório só
        run: |
          set -e
          mkdir -p publicar/painel-novo
          cp index.html dashboard.html manifest.json sw.js _redirects publicar/
          cp -r brand icons vendor publicar/
          cp -r frontend/dist/. publicar/painel-novo/
          echo "--- o que vai ao ar ---"
          find publicar -maxdepth 2 -type f | sort

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publicar --project-name marquesa-dev --branch develop

      - name: Confirmar o deployment publicado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deployment list --project-name marquesa-dev
