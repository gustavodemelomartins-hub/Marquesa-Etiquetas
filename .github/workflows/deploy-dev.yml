name: Deploy DEV (Cloudflare Pages)

# marquesa-dev é um projeto Pages Direct Upload — não tem Git Integration
# nativa da Cloudflare, e não pode ganhar uma depois de criado. Este
# workflow É o mecanismo de deploy, e publica o AMBIENTE DEV INTEIRO num
# endereço só: marquesa-dev.pages.dev.
#
# O que vai no ar:
#   /                  → redireciona para o painel (ver _redirects)
#   /dashboard.html    → o painel: Etiqueta · Estoque · Revendedoras · Vendas
#   /index.html        → o app de etiquetas autônomo, mantido como
#                        referência; não é mais destino de navegação
#   /painel-novo/      → o frontend React, no endereço em que ele nasceu;
#                        mantido para não quebrar link antigo
#   /v2/               → O SISTEMA MARQUESA V2: o MESMO bundle React de
#                        /painel-novo/, publicado no endereço definitivo.
#                        Dois caminhos, um build — não há como um ficar
#                        para trás do outro
#   /prototype/        → o protótipo estático navegável, preservado como
#                        REFERÊNCIA VISUAL; não é o sistema
#
# Um DEV só. Nada aqui toca main, marquesa-api ou marquesa-db — o Worker
# staging (marquesa-api-staging) é publicado por outro caminho, à parte
# deste arquivo.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'src/dashboard.tpl.html'
      - 'src/build.py'
      - 'index.html'
      - 'dashboard.html'
      - 'sw.js'
      - 'manifest.json'
      - '_redirects'
      - 'brand/**'
      - 'icons/**'
      - 'vendor/**'
      - '.github/workflows/deploy-dev.yml'
      # O painel do projeto (docs/project/dashboard) sobe junto, em /projeto/.
      # Ele é uma tela de acompanhamento interna: existe no DEV e em lugar
      # nenhum além dele — produção publica por outro caminho, que não lê
      # este diretório.
      - 'docs/project/dashboard/**'
      # Protótipo V2: somente o pacote explicitamente montado pelo gerador
      # entra no Pages. Markdown, testes e imagens de evidência ficam no Git.
      - 'docs/ux/**'
      - 'scripts/build-prototype.mjs'
      - 'scripts/serve-prototype.mjs'
      - 'scripts/verify-prototype.mjs'
      # O schema e as migrations não publicam nada no Pages, mas o passo
      # "Schema e migration continuam dizendo a mesma coisa" mora aqui — e um
      # teste que só roda quando alguém por acaso mexe no painel é um teste
      # que não roda. Mudança de banco tem de acordar este workflow.
      - 'api/schema.sql'
      - 'api/migracao-*.sql'
      - 'src/migracao-*-test.mjs'
  # Permite reexecutar sem precisar de um commit que toque os caminhos acima.
  workflow_dispatch: {}

# Evita dois deploys concorrentes pisando um no outro se dois pushes
# chegarem em sequência rápida.
concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar, montar e publicar em marquesa-dev.pages.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # histórico inteiro: o teste de migration compara o schema atual
          # com o de antes dela, e busca esse "antes" no próprio Git
          fetch-depth: 0

      - name: Node 22 com cache do npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            src/package-lock.json

      - name: Instalar dependências do painel novo
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador dos testes do protótipo
        working-directory: src
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes do painel novo
        working-directory: frontend
        run: npm test

      # O endereço da API entra como sugestão no formulário de conexão —
      # o app NÃO conecta sozinho, e a chave continua sendo digitada por
      # quem abre. Sem isto, validar pelo telefone começa por digitar uma
      # URL de 58 caracteres numa tela de 390px.
      #
      # `marquesa-api-staging-v2` fala com `marquesa-db-staging-v2`, a cópia
      # da operação. Nenhum endereço de produção aparece aqui.
      - name: Build do painel novo (inclui tsc --noEmit)
        working-directory: frontend
        env:
          VITE_API_URL: https://marquesa-api-staging-v2.marquesaasemijoias.workers.dev
          VITE_APP_ENV: dev
        run: npm run build

      # O único teste de backend que cabe no CI: não precisa de Worker, de D1
      # nem de rede — roda contra dois SQLite temporários com o `node:sqlite`
      # do runtime. Ele prova que `api/schema.sql` e as migrations continuam
      # dizendo a mesma coisa; divergirem em silêncio só quebraria no dia de
      # criar o banco do zero, que é o pior dia para descobrir.
      #
      # `fetch-depth: 0` é necessário: o teste pega o schema ANTERIOR do
      # histórico do Git, e um clone raso não o teria.
      - name: Schema e migration continuam dizendo a mesma coisa
        run: node src/migracao-variantes-test.mjs

      # dashboard.html é MONTADO a partir de src/dashboard.tpl.html. Rodar o
      # build aqui é o que garante que o painel publicado seja o do template
      # — nunca uma versão parada que alguém esqueceu de regerar.
      - name: Montar o painel a partir do template
        run: python3 src/build.py

      # O painel do projeto lê os .md de docs/project. Regerar aqui garante
      # que a tela publicada no DEV nunca mostre um número mais velho que o
      # documento — e o --check falharia antes, no gate `projeto-painel`.
      - name: Regerar os dados do painel do projeto
        run: node scripts/build-project-dashboard.mjs

      - name: Montar e verificar o protótipo V2
        run: |
          set -e
          node scripts/build-prototype.mjs .tmp/prototype-ci
          node scripts/serve-prototype.mjs .tmp/prototype-ci 8878 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8878/prototype/ >/dev/null && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8878/prototype/ >/dev/null
          node scripts/verify-prototype.mjs
          DEMO_BASE_URL=http://127.0.0.1:8878 DEMO_BUNDLED=1 node docs/ux/prototype/verify-demo-data.mjs
          PROTOTYPE_BASE_URL=http://127.0.0.1:8878/prototype/ node docs/ux/03-screens/nuvemshop/verify-master.mjs

      - name: Juntar o site do DEV num diretório só
        run: |
          set -e
          mkdir -p publicar/painel-novo publicar/v2 publicar/projeto
          cp index.html dashboard.html manifest.json sw.js _redirects publicar/
          cp -r brand icons vendor publicar/
          # O MESMO bundle nos dois endereços. `base: './'` no vite.config.ts
          # é o que permite isso: os assets são relativos ao index.html, então
          # a cópia funciona em qualquer prefixo sem rebuild. O logo oficial
          # nem chega a ser um arquivo separado — o Vite o embute como data
          # URI, e por isso ele não tem caminho que possa quebrar.
          cp -r frontend/dist/. publicar/painel-novo/
          cp -r frontend/dist/. publicar/v2/
          cp docs/project/dashboard/index.html docs/project/dashboard/estilo.css docs/project/dashboard/painel.js docs/project/dashboard/data.js publicar/projeto/
          node scripts/build-prototype.mjs publicar
          echo "--- o que vai ao ar ---"
          find publicar -maxdepth 3 -type f | sort

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publicar --project-name marquesa-dev --branch develop

      - name: Confirmar o deployment publicado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deployment list --project-name marquesa-dev
