[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marquesa-intelligence"
version = "0.1.0"
description = "Read-only, deterministic commercial intelligence adapters for Marquesa"
requires-python = ">=3.11"
dependencies = ["google-auth>=2.56.2,<3", "requests>=2.34.2,<3", "tzdata>=2025.2"]

[project.scripts]
marquesa-intelligence = "marquesa_intelligence.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marquesa_intelligence*"]
