name = "marquesa-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# go-live 2026-08-22: banco novo, carregado a partir do DEV congelado
# (772 produtos, 1.171 movimentos, 10 vendas, 4 maletas abertas/382 peças —
# ver docs/archive/PLANO-MESTRE-MARQUESA.md § go-live). `marquesa-db` antigo
# (089153a9-cee5-4887-b789-a23b1cf419f5) fica intacto como rollback; não é
# mais o alvo do binding raiz.
# Workers Logs (08/10/2026, REGRAS §60): guarda o que o Worker escreve no
# console — a falha de rota (`[api] ...`) e a requisição pesada no D1
# (`{"evento":"d1-requisicao-pesada",...}`) — para que cota esgotada e
# consulta demais deixem de ser invisíveis até a tela cair. Só os logs do
# código: o log automático de invocação fica DESLIGADO, porque ele grava a
# URL inteira (busca por nome de cliente vai na query string).
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[d1_databases]]
binding = "DB"
database_name = "marquesa-db-prod"
database_id = "51dd629b-52dc-46d0-a1af-fa37f0a79533"

# Fotos das peças: os bytes moram aqui; o D1 guarda só a chave do objeto
# (migracao-catalogo.sql). Ficou de fora do go-live de 2026-08-22 porque a
# conta respondia 10042 (R2 não habilitado). Em 29/09/2026 o Gustavo
# habilitou o R2 e autorizou; o bucket de PRODUÇÃO `marquesa-fotos` foi
# criado nesse dia. DEV continua com o seu (`marquesa-fotos-dev`, bloco
# [env.staging]) — os dois nunca se cruzam. Não há credencial aqui: o
# binding é a autorização. As fotos não são públicas; a tela lê por um link
# assinado com prazo (`assinatura.js`).
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "marquesa-fotos"

# Quais endereços podem chamar a API pelo navegador. Não é segredo — é o
# endereço público do painel — então mora aqui, versionado, e não no painel
# da Cloudflare: o `wrangler deploy` trata este arquivo como a fonte da
# verdade e APAGA as variáveis de texto criadas pelo painel que não estejam
# declaradas aqui. (Segredos, como a API_KEY, não são afetados.)
# Para liberar mais de um endereço, separe por vírgula.
[vars]
# A V2 mora no projeto Pages `marquesa`, criado em 26/09/2026. O subdomínio
# `marquesa.pages.dev` já pertencia a outra conta, e a Cloudflare atribuiu
# `marquesa-9da.pages.dev` — é ESTE o endereço que precisa estar aqui, senão
# o navegador recusa toda chamada e a tela abre sem dado nenhum. O painel
# clássico continua na lista: ele não sai do ar. Ver
# docs/releases/RC-V2-2026-09-24.md § E.
ORIGENS_PERMITIDAS = "https://gustavodemelomartins-hub.github.io,https://marquesa-9da.pages.dev"

# Trava central de escrita na Nuvemshop (api/src/nuvemshop.js › chamar).
# Produção precisa desta linha em "true": sem ela, o padrão seguro do
# código (ausente = bloqueado) pararia de empurrar estoque de verdade para
# a loja no próximo deploy — silenciosamente, porque o resto da
# sincronização continuaria "funcionando", só sem escrever nada. Mudar
# para "false" aqui é decisão consciente, não acidente de config ausente.
# Não é segredo — não autoriza nada sozinha, só destrava o método HTTP.
NUVEMSHOP_WRITES_ENABLED = "true"

# Publicação de catálogo na Nuvemshop (api/src/catalogo/publicador.js) —
# criar produto, atualizar ficha, publicar e despublicar.
#
# DELIBERADAMENTE NÃO DECLARADA. Ausente vale como desligada, então a
# publicação está travada em todo ambiente, inclusive aqui.
#
# Por que uma SEGUNDA trava, se já existe a linha acima: porque a de cima
# está em "true" e precisa continuar — o empurrão de estoque depende dela.
# Empurrar estoque para um produto que já existe e CRIAR um produto na loja
# são atos de tamanhos diferentes, e uma trava só não os separa. Com esta
# linha ausente, preparar e aprovar continuam funcionando normalmente; o
# único passo travado é a escrita externa.
#
# Ligar é decisão humana explícita e release próprio, depois de uma rodada
# seca (POST /api/catalogo/publicacao/rodada, que já é seca por padrão)
# mostrando exatamente o que subiria:
#     NUVEMSHOP_PUBLICACAO_ENABLED = "true"

# Fotos próprias das peças (binding R2 `FOTOS`) — ver o bloco no topo deste
# arquivo: ligado em 29/09/2026 no bucket `marquesa-fotos`.

# Produtos Montáveis / "Monte seu Colar" (api/REGRAS.md §42) — parado antes de
# fechar SKU comercial x base x componentes, base trocável, Ouro 18k/Prata
# 925 e o estorno de troca. Retomada prevista 2026-09-07 — ver
# docs/releases/SESSION_CLOSE_2026-09-06.md § Retomar amanhã.
# Fail-closed como a linha acima: só "true" exato liga. `api/src/index.js` e
# `api/src/personalizacao.js` recusam com 503 enquanto isto não for "true";
# nenhuma rota normal de venda depende desta linha.
#
# LIGADO em 27/09/2026, a pedido da operação: o modelo passa a nascer na
# venda (api/REGRAS.md §47) e deixa de precisar de cadastro prévio. Voltar
# para "false" desliga a tela e a rota sem mexer em dado nenhum.
PERSONALIZACAO_ATIVA = "true"

# Sincronização automática com a Nuvemshop — §61 (api/REGRAS.md).
#
# RELIGADA EM 2026-10-08, depois do Inventário #1 conciliado (842 códigos,
# 0 pendências): a base de produção passou a ser a fonte da verdade do
# estoque. Histórico: desligada em 2026-08-22 (Fase 0 do go-live) porque a
# operação real estava no DEV e este Worker empurraria número velho para a
# loja. Ver docs/archive/PLANO-MESTRE-MARQUESA.md § 7.3 Fase 0 e § Risco R1.
#
# O que o cron faz AGORA não é mais a rodada inteira de antes (que relia o
# catálogo dos dois lados e empurrava tudo):
#
#   */10 * * * *  puxa os pedidos do site desde o corte (`config.syncCorteEm`)
#                 e envia os códigos da fila `nuvemshop_fila` que estiverem
#                 devidos. Fila vazia = poucas consultas, nenhum catálogo lido.
#   0 9 * * *     além disso, uma conferência diária da loja inteira (06:00 de
#                 Brasília). Divergência pequena volta para a fila; em massa,
#                 fica anunciada e espera gente (o cron nunca força o freio).
#
# DESLIGAR EM EMERGÊNCIA não exige deploy: `config.nuvemshopSyncAtivo = false`
# (tela Nuvemshop › Estoque online, ou PUT /api/nuvemshop/estoque/automatico).
# Desligado, nada sai para a loja e a fila continua guardando o que mudou.
#
# ⚠️ Esta lista é a fonte da verdade: o `wrangler deploy` reescreve os crons
# da Cloudflare a partir dela. `crons = []` desarma tudo.
[triggers]
crons = ["*/10 * * * *", "0 9 * * *"]

# ------------------------------------------------------------- ambiente DEV
# Worker separado, D1 separado, R2 separado, sem cron, sem credencial da
# Nuvemshop real. `wrangler deploy --env staging` publica em
# marquesa-api-staging — nunca em marquesa-api (produção). Rodar sem
# `--env` continua publicando produção, exatamente como hoje.
[env.staging]
name = "marquesa-api-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "marquesa-db-dev"
database_id = "dcc36f65-daaa-42a4-9fbd-15e6f27e4d4b"

# Fotos do ambiente DEV: bucket próprio, nunca o de produção
# (marquesa-fotos). Criado à parte — ver docs/operations/DEVELOPMENT.md § Ambiente DEV.
[[env.staging.r2_buckets]]
binding = "FOTOS"
bucket_name = "marquesa-fotos-dev"

[env.staging.vars]
ORIGENS_PERMITIDAS = "https://marquesa-dev.pages.dev,https://marquesa-dev-legado.pages.dev"

# Staging PODE receber NUVEMSHOP_TOKEN/NUVEMSHOP_STORE_ID reais como secret
# (para ler catálogo/produtos/variações/imagens de verdade). A trava contra
# escrita não depende mais só da ausência de credencial — é estrutural, em
# api/src/nuvemshop.js › chamar: com a linha abaixo em "false", qualquer
# POST/PUT/PATCH/DELETE para a Nuvemshop é recusado ANTES do fetch sair do
# Worker, não importa a rota, o token ou quem chamou. Mudar para "true" é
# decisão consciente — não é segredo, mas muda a postura de segurança do
# ambiente, então documente por que se mudar. Ver docs/SECURITY.md.
NUVEMSHOP_WRITES_ENABLED = "false"

# DEV é descartável e é onde o trabalho de Produtos Montáveis continua amanhã
# — ligado aqui, ao contrário da produção, para o checklist manual
# (docs/testing/MONTE_SEU_COLAR_CHECKLIST.md) continuar testável sem passo extra.
PERSONALIZACAO_ATIVA = "true"
#
# Sem cron nenhum no DEV. Uma sincronização automática de madrugada, num
# ambiente de teste, é exatamente o tipo de coisa que ninguém está olhando
# quando dá errado — e o DEV não deveria escrever em loja nenhuma sozinho.
[env.staging.triggers]
crons = []

# ------------------------------------------------- ambiente STAGING V2
# Terceiro ambiente, criado em 20/09/2026 para a validação da V2 com dados
# reais. Existe porque `marquesa-db-dev` é um snapshot CONGELADO de agosto,
# 12 tabelas atrás de produção — validar a V2 contra ele validaria o sistema
# errado. Este banco é uma cópia SOMENTE-LEITURA de `marquesa-db-prod`
# tirada com `wrangler d1 export`, importada aqui, e daqui em diante segue
# vida própria: o que se escreve na validação NUNCA volta para produção.
#
#   D1   marquesa-db-staging-v2  db76e50a-af76-4228-bcad-6be161a61344
#   de   marquesa-db-prod        51dd629b-52dc-46d0-a1af-fa37f0a79533
#
# Nenhum nome de produção aparece neste bloco, e é isso que o hook
# `.claude/hooks/protect-production.mjs` usa para provar que `--env
# staging-v2` é DEV: um ambiente nomeado só é DEV quando não reaproveita
# NENHUM recurso do ambiente raiz.
[env.staging-v2]
name = "marquesa-api-staging-v2"
workers_dev = true

# Este ambiente serve CPF, telefone e histórico de compra de cliente real.
# As Preview URLs (um endereço público por versão publicada) ficam ligadas
# por padrão quando `workers_dev = true`, e cada uma seria mais um endereço
# servindo esses dados. A chave protegeria todas elas — mas um endereço que
# não precisa existir é melhor que um endereço bem protegido.
preview_urls = false

[[env.staging-v2.d1_databases]]
binding = "DB"
database_name = "marquesa-db-staging-v2"
database_id = "db76e50a-af76-4228-bcad-6be161a61344"

# Fotos da V2 DEV: o bucket de DEV, nunca o de produção (marquesa-fotos).
# Até 20/09/2026 este bloco não existia porque a conta respondia 10042 (R2
# não habilitado); o R2 foi ligado em 29/09/2026 e o binding entrou em
# 04/10/2026 para a foto da cliente (avatar, chave `clientes/<id>/avatar`).
# O bucket é o MESMO do `[env.staging]` — os dois são DEV e os ids de cliente
# dos dois bancos podem coincidir, então o que um grava o outro pode ler.
# Sem o binding, `env.FOTOS` continua opcional em `fotos-storage.js`: o que
# precisa dos BYTES recusa com `bloqueio: "sem_r2"`, nunca um 500.
[[env.staging-v2.r2_buckets]]
binding = "FOTOS"
bucket_name = "marquesa-fotos-dev"

[env.staging-v2.vars]
# O /v2/ é servido pelo mesmo Pages do DEV.
ORIGENS_PERMITIDAS = "https://marquesa-dev.pages.dev"

# A trava estrutural de escrita na Nuvemshop, em "false" como no outro
# staging: qualquer POST/PUT/PATCH/DELETE para a loja real é recusado ANTES
# do fetch sair do Worker (api/src/nuvemshop.js > chamar). Ler catálogo
# continua possível; escrever não, em rota nenhuma.
NUVEMSHOP_WRITES_ENABLED = "false"

# NUVEMSHOP_PUBLICACAO_ENABLED continua DELIBERADAMENTE AUSENTE aqui, como
# em produção. Ausente vale como desligada: preparar e aprovar publicação
# funcionam, a escrita externa não sai.

# Espelha produção. A V2 mostra a tela de Monte seu Colar indisponível em
# vez de fingir que ela funciona — ligar isto aqui daria à validação um
# comportamento que a operação real não tem.
PERSONALIZACAO_ATIVA = "false"

# Sem cron. Um ambiente de validação não sincroniza com loja nenhuma
# sozinho, de madrugada, sem ninguém olhando.
[env.staging-v2.triggers]
crons = []
